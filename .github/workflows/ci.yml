name: Kiem tra BPO Network Lab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cai cong cu Python
        run: python -m pip install pytest pyyaml

      - name: Kiem tra Python
        run: |
          python -m compileall -q metrics scripts topology
          python -m pytest -q

      - name: Kiem tra Docker Compose
        run: docker compose --env-file .env.example -f docker/docker-compose.yml config --quiet

      - name: Kiem tra YAML va JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          ignored = {'.git', 'node_modules'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or ignored.intersection(path.parts):
                  continue
              if path.suffix in {'.yml', '.yaml'}:
                  yaml.safe_load(path.read_text(encoding='utf-8'))
              elif path.suffix == '.json':
                  json.loads(path.read_text(encoding='utf-8'))
          PY

      - name: Kiem tra Prometheus
        run: |
          docker run --rm -v "$PWD/docker/prometheus:/etc/prometheus:ro" --entrypoint /bin/promtool prom/prometheus:v3.13.2 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/docker/prometheus:/etc/prometheus:ro" --entrypoint /bin/promtool prom/prometheus:v3.13.2 check rules /etc/prometheus/rules/bpo_alerts.yml

      - name: Kiem tra Alertmanager
        run: docker run --rm -v "$PWD/docker/alertmanager:/etc/alertmanager:ro" --entrypoint /bin/amtool prom/alertmanager:v0.33.1 check-config /etc/alertmanager/alertmanager.yml

      - name: Quet secret bang gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
