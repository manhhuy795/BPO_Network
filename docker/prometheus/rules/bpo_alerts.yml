groups:
  - name: bpo_network_alerts
    interval: 5s
    rules:
      - alert: BPOExporterDown
        expr: up{job="bpo_exporter"} == 0
        for: 10s
        labels:
          severity: cao
          category: monitoring
        annotations:
          summary: "Không thu thập được BPO exporter"
          description: "Prometheus không thể lấy số liệu từ exporter trên Ubuntu VM."
          suspected_cause: "Exporter dừng, cổng 9105 bị chặn hoặc Ubuntu VM mất kết nối."

      - alert: WANMonitorDown
        expr: |
          (bpo_wan_status_read_success == 0)
          and on(instance, job) (up{job="bpo_exporter"} == 1)
        for: 5s
        labels:
          severity: cao
          category: monitoring
        annotations:
          summary: "Không đọc được trạng thái giám sát WAN"
          description: "Exporter còn hoạt động nhưng không thể đọc hoặc phân tích runtime/wan_status.json."
          suspected_cause: "File trạng thái bị mất, không có quyền đọc hoặc chứa JSON sai định dạng."

      - alert: WANStatusStale
        expr: |
          (bpo_wan_status_read_success == 1)
          and on(instance, job) (bpo_wan_monitor_up == 0)
          and on(instance, job) (up{job="bpo_exporter"} == 1)
        for: 5s
        labels:
          severity: cao
          category: monitoring
        annotations:
          summary: "Trạng thái giám sát WAN không còn mới"
          description: "Exporter đọc được JSON nhưng timestamp thiếu, ở tương lai hoặc đã quá ngưỡng 10 giây."
          suspected_cause: "wan_monitor.py đã dừng, bị treo hoặc đồng hồ hệ thống không chính xác."

      - alert: FPTDownViettelAvailable
        expr: |
          (bpo_link_up{provider="fpt"} == 0)
          and on(instance, job) (bpo_link_up{provider="viettel"} == 1)
          and on(instance, job) (bpo_wan_monitor_up == 1)
          and on(instance, job) (up{job="bpo_exporter"} == 1)
        for: 10s
        labels:
          severity: trung_binh
          category: wan
        annotations:
          summary: "FPT mất, Viettel còn hoạt động"
          description: "Đường FPT không hoạt động nhưng đường dự phòng Viettel vẫn sẵn sàng."
          suspected_cause: "Sự cố tuyến FPT hoặc interface FPT của router doanh nghiệp."

      - alert: BothWANDown
        expr: |
          (bpo_link_up{provider="fpt"} == 0)
          and on(instance, job) (bpo_link_up{provider="viettel"} == 0)
          and on(instance, job) (bpo_wan_monitor_up == 1)
          and on(instance, job) (up{job="bpo_exporter"} == 1)
        for: 10s
        labels:
          severity: cao
          category: wan
        annotations:
          summary: "Cả FPT và Viettel đều mất"
          description: "Hai đường WAN cùng không hoạt động; đây là cảnh báo mất Internet chính."
          suspected_cause: "Router doanh nghiệp, kết nối chung hoặc đồng thời hai tuyến nhà mạng gặp lỗi."

      - alert: CRMProcessDown
        expr: |
          (bpo_service_process_up{service="crm"} == 0)
          and on(instance, job) (up{job="bpo_exporter"} == 1)
        for: 10s
        labels:
          severity: trung_binh
          category: service_process
        annotations:
          summary: "Tiến trình CRM đã dừng"
          description: "PID do script CRM quản lý không còn tồn tại."
          suspected_cause: "Tiến trình HTTP server CRM bị dừng hoặc thoát do lỗi."

      - alert: CRMHttpUnavailable
        expr: |
          (probe_success{job="blackbox_http", service="crm"} == 0)
          and on(instance, job, service) (up{job="blackbox_http"} == 1)
          and on(service) (bpo_service_process_up{service="crm"} == 1)
        for: 10s
        labels:
          severity: trung_binh
          category: service_http
        annotations:
          summary: "HTTP CRM không truy cập được"
          description: "Tiến trình CRM còn sống nhưng HTTP end-to-end từ máy dự án không trả về HTTP 200."
          suspected_cause: "Cổng 80 không phản hồi, HTTP trả mã lỗi hoặc đường mạng tới CRM bị chặn."

      - alert: CFONOProcessDown
        expr: |
          (bpo_service_process_up{service="cfono"} == 0)
          and on(instance, job) (up{job="bpo_exporter"} == 1)
        for: 10s
        labels:
          severity: trung_binh
          category: service_process
        annotations:
          summary: "Tiến trình CFONO đã dừng"
          description: "PID do script CFONO quản lý không còn tồn tại."
          suspected_cause: "Tiến trình HTTP server CFONO bị dừng hoặc thoát do lỗi."

      - alert: CFONOHttpUnavailable
        expr: |
          (probe_success{job="blackbox_http", service="cfono"} == 0)
          and on(instance, job, service) (up{job="blackbox_http"} == 1)
          and on(service) (bpo_service_process_up{service="cfono"} == 1)
        for: 10s
        labels:
          severity: trung_binh
          category: service_http
        annotations:
          summary: "HTTP CFONO không truy cập được"
          description: "Tiến trình CFONO còn sống nhưng HTTP end-to-end từ máy dự án không trả về HTTP 200."
          suspected_cause: "Cổng 80 không phản hồi, HTTP trả mã lỗi hoặc đường mạng tới CFONO bị chặn."

      - alert: HighPacketLoss
        expr: |
          (bpo_packet_loss_percent > 20)
          and on(instance, job, provider) (bpo_link_up == 1)
          and on(instance, job) (bpo_wan_monitor_up == 1)
          and on(instance, job) (up{job="bpo_exporter"} == 1)
        for: 15s
        labels:
          severity: trung_binh
          category: performance
        annotations:
          summary: "Tỷ lệ mất gói WAN cao"
          description: "Tuyến {{ $labels.provider }} mất trên 20% gói trong khi link vẫn UP."
          suspected_cause: "Nghẽn mạng, lỗi vật lý chập chờn hoặc chất lượng tuyến nhà mạng suy giảm."

      - alert: HighLatency
        expr: |
          (bpo_ping_rtt_avg_ms > 100)
          and on(instance, job, provider) (bpo_link_up == 1)
          and on(instance, job) (bpo_wan_monitor_up == 1)
          and on(instance, job) (up{job="bpo_exporter"} == 1)
        for: 30s
        labels:
          severity: thap
          category: performance
        annotations:
          summary: "Độ trễ WAN cao"
          description: "RTT trung bình tuyến {{ $labels.provider }} vượt 100 ms trong khi link vẫn UP."
          suspected_cause: "Tuyến nhà mạng nghẽn, định tuyến vòng hoặc chất lượng kết nối suy giảm."
