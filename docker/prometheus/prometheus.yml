global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: bpo_lab
    site: tru_so_345

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          environment: bpo_lab
          site: tru_so_345

  - job_name: bpo_exporter
    static_configs:
      - targets: ["ubuntu-vm:9105"]
        labels:
          environment: bpo_lab
          site: tru_so_345

  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://ubuntu-vm:9105/health
        labels:
          environment: bpo_lab
          site: tru_so_345
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          environment: bpo_lab
          site: tru_so_345
