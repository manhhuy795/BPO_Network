global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    environment: bpo_lab
    site: tru_so_345

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  # Giữ tên cũ ở biên Alertmanager để correlation hiện tại không phải thay đổi.
  alert_relabel_configs:
    - source_labels: [alertname]
      regex: "CRM(ProcessDown|HttpUnavailable)"
      target_label: alertname
      replacement: CRMDown
    - source_labels: [alertname]
      regex: "CFONO(ProcessDown|HttpUnavailable)"
      target_label: alertname
      replacement: CFONODown
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          environment: bpo_lab
          site: tru_so_345

  - job_name: bpo_exporter
    static_configs:
      - targets: ["ubuntu-vm:9105"]
        labels:
          environment: bpo_lab
          site: tru_so_345

  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://ubuntu-vm:9105/health
        labels:
          service: exporter
          environment: bpo_lab
          site: tru_so_345
      - targets:
          - http://ubuntu-vm:9105/probe/crm
        labels:
          service: crm
          environment: bpo_lab
          site: tru_so_345
      - targets:
          - http://ubuntu-vm:9105/probe/cfono
        labels:
          service: cfono
          environment: bpo_lab
          site: tru_so_345
      - targets:
          - http://alertmanager:9093/-/healthy
        labels:
          component: alertmanager
          environment: bpo_lab
          site: tru_so_345
      - targets:
          - http://n8n:5678/healthz
        labels:
          component: n8n
          environment: bpo_lab
          site: tru_so_345
      - targets:
          - http://glpi/
        labels:
          component: glpi
          environment: bpo_lab
          site: tru_so_345
      - targets:
          - http://grafana:3000/api/health
        labels:
          component: grafana
          environment: bpo_lab
          site: tru_so_345
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: blackbox_tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["postgres:5432"]
        labels:
          component: postgres
          environment: bpo_lab
          site: tru_so_345
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          environment: bpo_lab
          site: tru_so_345
